<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360">
  <!-- Yellow background for "Tribe" -->
  <rect x="64" y="132" width="512" height="228" fill="#FFD93D"/>
  
  <!-- Black background for "Dala" -->
  <rect x="512" y="132" width="448" height="228" fill="#000000"/>
  
  <!-- "Tribe" text in black -->
  <text x="288" y="300" font-family="Arial, sans-serif" font-size="140" font-weight="bold" fill="#000000" text-anchor="middle">Tribe</text>
  
  <!-- Small red play button icon between Tribe and Dala -->
  <circle cx="520" cy="200" r="12" fill="#FF1744"/>
  <polygon points="520,194 520,206 530,200" fill="#FFD93D"/>
  
  <!-- "Dala" text in white -->
  <text x="736" y="300" font-family="Arial, sans-serif" font-size="140" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Dala</text>
</svg>
